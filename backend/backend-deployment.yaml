apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-backend
  labels:
    app: food-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-backend
  template:
    metadata:
      labels:
        app: food-backend
    spec:
      containers:
      - image: hanif040/food-backend:v1
        name: test-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: MONGO_URL
          value: "mongodb://mongodb-service:27017/food-delivery"
